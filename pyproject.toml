[project]
name = "elasticity"
version = "0.1.0"
description = "Discount elasticity and markdown optimisation on Dunnhumby retail transaction data"
requires-python = ">=3.11"
dependencies = [
    # Raw joins and aggregation — reads the CSVs directly, no server, no load step
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=16.0",          # parquet writer for data/interim/panel.parquet
    "numpy>=1.26",
    # Two-way FE with thousands of product dummies, clustered SEs, IV
    "pyfixest>=0.24",
    # ML comparison (Phase 5)
    "lightgbm>=4.3",
    "shap>=0.45",
    # Charts
    "matplotlib>=3.8",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
